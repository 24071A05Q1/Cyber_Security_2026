{% extends 'portal/base.html' %}
{% load static %}

{% block content %}
<style>
  body {
    background-image: url("{% static 'portal/img/library.jpg' %}");
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .reset-card {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 15px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    padding: 35px;
    width: 100%;
    max-width: 420px;
  }

  .reset-card h4 {
    text-align: center;
    color: #0d6efd;
    margin-bottom: 25px;
  }

  .btn-reset {
    background-color: #0d6efd;
    border: none;
    color: #fff;
    padding: 10px;
    width: 100%;
    border-radius: 5px;
    transition: background 0.3s;
  }

  .btn-reset:hover {
    background-color: #0b5ed7;
  }
</style>

<div class="reset-card">
  <h4>Reset Your Password</h4>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn-reset mt-3">Update Password</button>
  </form>
</div>
{% endblock %}
