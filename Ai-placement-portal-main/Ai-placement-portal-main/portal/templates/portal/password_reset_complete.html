{% extends 'portal/base.html' %}
{% load static %}

{% block content %}
<style>
  body {
    background-image: url("{% static 'portal/img/library.jpg' %}");
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .reset-card {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 15px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    padding: 35px;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  .reset-card h4 {
    color: #198754;
    margin-bottom: 20px;
  }

  .reset-card p {
    color: #555;
  }

  .btn-login {
    background-color: #198754;
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    text-decoration: none;
  }

  .btn-login:hover {
    background-color: #157347;
  }
</style>

<div class="reset-card">
  <h4>Password Reset Successful 🎉</h4>
  <p>Your password has been updated successfully.</p>
  <a href="{% url 'login' %}" class="btn-login mt-3">Go to Login</a>
</div>
{% endblock %}
