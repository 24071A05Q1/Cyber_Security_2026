{% extends 'portal/base.html' %}
{% load static %}

{% block content %}
<style>
  .password-reset-page {
    background-image: url("{% static 'portal/img/library.jpg' %}");
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    min-height: 100vh;
    margin: 0;
    padding: 0;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
  }

  .reset-container {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .reset-card {
    background: rgba(255, 255, 255, 0.98);
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    padding: 50px 45px;
    width: 100%;
    max-width: 500px;
    backdrop-filter: blur(10px);
  }

  .reset-card h4 {
    text-align: center;
    color: #0d6efd;
    margin-bottom: 35px;
    font-size: 1.75rem;
    font-weight: 600;
  }

  .email-section {
    margin-bottom: 25px;
  }

  .form-label {
    color: #333;
    font-weight: 500;
    margin-bottom: 12px;
    font-size: 1.05rem;
    display: block;
  }

  .email-input {
    border: 2px solid #d1d5db;
    border-radius: 10px;
    padding: 18px 20px;
    font-size: 1.1rem;
    transition: all 0.3s ease;
    width: 100%;
    box-sizing: border-box;
    font-family: inherit;
  }

  .email-input:focus {
    border-color: #0d6efd;
    box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.1);
    outline: none;
  }

  .button-wrapper {
    text-align: center;
    margin-top: 30px;
  }

  .btn-reset {
    background: linear-gradient(135deg, #0d6efd 0%, #0b5ed7 100%);
    border: none;
    color: #fff;
    padding: 14px 40px;
    border-radius: 10px;
    font-size: 1.05rem;
    font-weight: 600;
    transition: all 0.3s ease;
    cursor: pointer;
    display: inline-block;
  }

  .btn-reset:hover {
    background: linear-gradient(135deg, #0b5ed7 0%, #0a58ca 100%);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(13, 110, 253, 0.4);
  }

  .btn-reset:active {
    transform: translateY(0);
  }

  .back-link {
    text-align: center;
    margin-top: 25px;
  }

  .back-link a {
    color: #6c757d;
    text-decoration: none;
    font-size: 1rem;
    transition: color 0.3s ease;
  }

  .back-link a:hover {
    color: #495057;
    text-decoration: underline;
  }

  .alert {
    border-radius: 10px;
    margin-bottom: 25px;
    padding: 15px;
  }

  @media (max-width: 576px) {
    .reset-card {
      padding: 35px 30px;
      max-width: 100%;
    }
    
    .reset-card h4 {
      font-size: 1.5rem;
    }

    .email-input {
      font-size: 1rem;
      padding: 16px 18px;
    }

    .btn-reset {
      padding: 12px 35px;
      font-size: 1rem;
    }
  }
</style>

<div class="password-reset-page">
  <div class="reset-container">
    <div class="reset-card">
      <h4>Forgot Password?</h4>

      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="email-section">
          <label for="id_email" class="form-label">Enter your registered email</label>
          <input type="email" name="email" class="email-input" id="id_email" placeholder="example@email.com" required>
        </div>
        
        <div class="button-wrapper">
          <button type="submit" class="btn-reset">Send Reset Link</button>
        </div>
      </form>

      <div class="back-link">
        <a href="{% url 'login' %}">← Back to Login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
